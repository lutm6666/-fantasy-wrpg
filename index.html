<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#12151d" />
<title>灰燼王境：Ashen Realms</title>
<style>
:root{--bg:#0d1016;--panel:#171c26;--panel2:#202736;--line:#343d50;--text:#edf0f5;--muted:#9ca7b8;--gold:#d6ad63;--danger:#d56d6d;--good:#6fc58a;--blue:#6e9ed6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1d2533 0,#0d1016 48%);color:var(--text);font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.app{width:min(100%,860px);margin:auto;padding:env(safe-area-inset-top) 14px calc(88px + env(safe-area-inset-bottom))}header{padding:20px 4px 10px}.brand{font-family:Georgia,serif;font-weight:700;letter-spacing:.06em;font-size:28px;color:#f0d39d}.sub{color:var(--muted);font-size:13px}.card{background:linear-gradient(180deg,rgba(30,37,50,.97),rgba(20,25,34,.97));border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 12px 35px #0006}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spread{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}.bar{height:10px;background:#0c0f14;border-radius:999px;overflow:hidden;border:1px solid #303748}.fill{height:100%;transition:.25s}.hp{background:linear-gradient(90deg,#9d3c46,#df6b6b)}.xp{background:linear-gradient(90deg,#806222,#dfb95f)}.enemy{background:linear-gradient(90deg,#68323a,#bd5662)}h2,h3{font-family:Georgia,serif;margin:0 0 8px}p{margin:8px 0}.story{font-size:17px}.muted{color:var(--muted)}button{appearance:none;border:1px solid #46516a;background:#242c3b;color:var(--text);border-radius:12px;padding:12px 14px;font:inherit;font-weight:650;cursor:pointer;touch-action:manipulation}button:active{transform:translateY(1px)}button.primary{background:linear-gradient(180deg,#80632f,#5f4822);border-color:#a47d3c;color:#fff4df}button.danger{background:#4e242a;border-color:#7a3c46}.choices{display:grid;gap:9px;margin-top:14px}.choices button{text-align:left}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.class-card{min-height:148px;text-align:left}.class-card b{display:block;font-family:Georgia,serif;color:#f3d89f;font-size:18px}.stat{font-size:13px;color:var(--muted)}.log{max-height:190px;overflow:auto;background:#0b0e13;border:1px solid #2f3748;border-radius:12px;padding:10px;font-size:13px;color:#c7ceda}.log div+div{margin-top:6px}.item{padding:10px;border:1px solid #333c4f;border-radius:11px;background:#151a23}.rare{color:#77aef2}.uncommon{color:#72c486}.legend{color:#d6ad63}.bottom{position:fixed;left:0;right:0;bottom:0;background:#111620eF;border-top:1px solid #30384a;padding:8px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));backdrop-filter:blur(14px);z-index:9}.bottom-inner{width:min(100%,860px);margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.bottom button{padding:9px 4px;font-size:12px}.toast{position:fixed;left:50%;top:max(18px,env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);background:#171d28;border:1px solid #53617c;color:white;border-radius:999px;padding:9px 14px;opacity:0;pointer-events:none;transition:.25s;z-index:20;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.hidden{display:none!important}.divider{height:1px;background:#30384a;margin:12px 0}.tag{font-size:11px;padding:2px 6px;border-radius:6px;background:#2d3545;color:#b8c1d0}.kpi{font-size:20px;font-weight:750}.modal{position:fixed;inset:0;background:#07090dbb;display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:15}.sheet{width:min(100%,720px);max-height:88vh;overflow:auto;background:#171d27;border:1px solid #3b465b;border-radius:20px 20px 12px 12px;padding:18px}.sheet h2{color:#f0d39d}@media(min-width:680px){.grid{grid-template-columns:repeat(3,1fr)}.modal{align-items:center}.sheet{border-radius:20px}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="app">
<header><div class="brand">灰燼王境</div><div class="sub">ASHEN REALMS · 中古奇幻文字 WRPG 原型 v0.1</div></header>
<section id="hud" class="card hidden"></section>
<main id="main"></main>
</div>
<nav id="nav" class="bottom hidden"><div class="bottom-inner">
<button onclick="showScene()">冒險</button><button onclick="showCharacter()">角色</button><button onclick="showInventory()">背包</button><button onclick="showJournal()">任務</button><button onclick="showMenu()">系統</button>
</div></nav>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div id="sheet" class="sheet"></div></div>
<script>
const $=s=>document.querySelector(s);const main=$('#main');
const classes={
 warrior:{name:'戰士',desc:'重甲近戰。以怒氣爆發與防守反擊壓制敵人。',hp:130,pow:15,def:10,skill:'盾擊',skillText:'造成高傷害並降低本回合受傷。'},
 paladin:{name:'聖騎士',desc:'重甲神聖戰士。能治療自己，對不死生物特別有效。',hp:120,pow:13,def:11,skill:'聖光裁決',skillText:'造成傷害並回復少量生命。'},
 ranger:{name:'遊俠',desc:'遠程獵手。擅長追蹤、伏擊與野外探索。',hp:105,pow:16,def:7,skill:'穿心箭',skillText:'高暴擊率的遠程射擊。'},
 rogue:{name:'盜賊',desc:'敏捷的機會主義者。能撬鎖、偷襲並利用地下人脈。',hp:100,pow:17,def:6,skill:'背刺',skillText:'敵人生命越低，傷害越高。'},
 mage:{name:'法師',desc:'奧術施法者。生命脆弱，但能以強大魔法控制戰局。',hp:90,pow:20,def:4,skill:'霜火爆裂',skillText:'極高傷害，但偶爾會失控反噬。'},
 cleric:{name:'牧師',desc:'信仰與秘儀的研究者。能驅散詛咒並維持長期作戰。',hp:110,pow:12,def:8,skill:'祈禱之槌',skillText:'穩定傷害並獲得護佑。'}
};
const baseState={created:false,name:'',classId:'',level:1,xp:0,gold:35,hp:100,maxHp:100,pow:10,def:5,location:'灰港',scene:'arrival',flags:{},quests:{},inventory:[{id:'bread',name:'乾硬麵包',type:'consumable',qty:2,desc:'回復 18 生命。'},{id:'potion',name:'初級治療藥水',type:'consumable',qty:1,desc:'回復 35 生命。'}],equipment:{weapon:null,armor:null,trinket:null},combat:null,log:[]};
let s=load()||structuredClone(baseState);
function save(){localStorage.setItem('ashen-realms-save',JSON.stringify(s));renderHud()}
function load(){try{return JSON.parse(localStorage.getItem('ashen-realms-save'))}catch(e){return null}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),1800)}
function change(label,n){if(!n)return;toast(`${label} ${n>0?'+':''}${n}`)}
function log(t){s.log.unshift(t);s.log=s.log.slice(0,40)}
function renderHud(){if(!s.created)return;$('#hud').classList.remove('hidden');$('#nav').classList.remove('hidden');let hp=Math.max(0,Math.round(s.hp/s.maxHp*100)),xp=s.xp%100;$('#hud').innerHTML=`<div class="spread"><div><b>${s.name}</b> <span class="pill">Lv.${s.level} ${classes[s.classId].name}</span><div class="muted">${s.location}</div></div><div style="text-align:right"><span class="legend">◆ ${s.gold}</span></div></div><div style="margin-top:10px"><div class="spread stat"><span>生命 ${s.hp}/${s.maxHp}</span><span>攻擊 ${s.pow} · 防禦 ${s.def}</span></div><div class="bar"><div class="fill hp" style="width:${hp}%"></div></div><div class="bar" style="margin-top:5px"><div class="fill xp" style="width:${xp}%"></div></div></div>`}
function boot(){if(!s.created)showCreate();else{renderHud();showScene()}}
function showCreate(){main.innerHTML=`<section class="card"><h2>建立你的冒險者</h2><p class="muted">西境曆 742 年。王國邊境陷入動盪，而你正乘著一艘漏水的商船抵達灰港。</p><label>角色名稱</label><input id="nameInput" maxlength="16" placeholder="輸入名稱" style="width:100%;margin:8px 0 16px;padding:13px;border-radius:12px;border:1px solid var(--line);background:#0f131a;color:white;font-size:16px"><h3>選擇職業</h3><div class="grid">${Object.entries(classes).map(([id,c])=>`<button class="class-card" onclick="chooseClass('${id}')"><b>${c.name}</b><span>${c.desc}</span><div class="stat" style="margin-top:8px">生命 ${c.hp} · 攻擊 ${c.pow} · 防禦 ${c.def}</div></button>`).join('')}</div></section>`}
function chooseClass(id){let name=$('#nameInput').value.trim()||'無名旅人',c=classes[id];s=structuredClone(baseState);s.created=true;s.name=name;s.classId=id;s.maxHp=c.hp;s.hp=c.hp;s.pow=c.pow;s.def=c.def;s.inventory.push({id:'starter',name:{warrior:'舊軍刀',paladin:'朝聖者戰槌',ranger:'榆木長弓',rogue:'缺口短劍',mage:'學徒法杖',cleric:'銀紋權杖'}[id],type:'weapon',pow:3,desc:'陪你走過第一段旅程的武器。'});s.equipment.weapon='starter';log(`${name} 抵達灰港。`);save();renderHud();showScene();toast(`你選擇了${c.name}`)}
const scenes={
 arrival(){return{title:'鹽霧中的灰港',text:'港口被低沉的鐘聲籠罩。幾名披著灰斗篷的守衛正在檢查旅客，一旁的老婦人緊抓著一張失蹤告示。遠處，斷裂的鐘塔像一根黑色手指指向天空。',choices:[['詢問守衛最近發生了什麼','guard'],['查看失蹤告示','notice'],['先去「斷錨酒館」','tavern'],['走向舊鐘塔附近','towerRoad']]}} ,
 guard(){return{title:'城衛隊長米菈',text:'「第三個了。」女隊長壓低聲音。「三週內三個人失蹤，最後都有人看見他們往舊鐘塔走。議會說是逃兵或醉鬼，我不信。」她打量你身上的旅行裝束。',choices:[['我可以調查。','acceptQuest'],['你願意付多少？','bargain'],['暫時不想惹麻煩。','arrival']]}} ,
 notice(){return{title:'被雨水浸透的告示',text:'紙上畫著一名年輕抄寫員。姓名：歐林。失蹤七日。最後出現於市場北街。告示角落有一個不屬於官方的墨色符號——像被劈成兩半的眼睛。',choices:[['記住那個符號','markSigil'],['去問酒館的人','tavern'],['找城衛隊長','guard']]}} ,
 tavern(){return{title:'斷錨酒館',text:'廉價麥酒與濕羊毛的氣味混在一起。吟遊詩人唱到一半便停下，因為角落裡兩名傭兵開始爭吵。酒保看見你盯著失蹤告示，默默把杯子擦得更用力。',choices:[['向酒保打聽失蹤者','bartender'],['偷聽傭兵爭吵','mercs'],['返回港口','arrival']]}} ,
 bartender(){let extra=s.classId==='rogue'?'他瞥見你袖口藏刀的方式，態度稍微鬆動。':'';return{title:'酒保哈洛',text:`「我什麼都不知道。」他說得太快。${extra} 你注意到櫃台下方刻著與告示角落相同的裂眼符號。`,choices:[[s.classId==='rogue'?'用地下行話試探他':'直接指出裂眼符號','bartenderPress'],['不逼問，買一杯酒','buyAle'],['離開','tavern']]}} ,
 towerRoad(){return{title:'鐘塔北巷',text:'石板路越走越窄。鐘塔大門被城衛封條封住，但側牆有一道半人高的破口。你聽見裡面傳來規律的刮擦聲。',choices:[['鑽過破口','towerEntry'],['檢查四周痕跡','track'],['返回港口','arrival']]}}
};
function showScene(){if(s.combat){renderCombat();return}let sc=scenes[s.scene]?scenes[s.scene]():scenes.arrival();main.innerHTML=`<section class="card"><div class="row"><span class="tag">${s.location}</span><span class="tag">探索</span></div><h2 style="margin-top:8px">${sc.title}</h2><p class="story">${sc.text}</p><div class="choices">${sc.choices.map(c=>`<button onclick="act('${c[1]}')">${c[0]}</button>`).join('')}</div></section><section class="card"><h3>旅途紀錄</h3><div class="log">${s.log.length?s.log.slice(0,8).map(x=>`<div>• ${x}</div>`).join(''):'尚無紀錄。'}</div></section>`}
function act(a){
 if(a==='arrival'||a==='guard'||a==='notice'||a==='tavern'||a==='bartender'||a==='towerRoad'){s.scene=a;save();showScene();return}
 if(a==='acceptQuest'){s.quests.missing={name:'鐘塔下的失蹤者',stage:1,desc:'調查灰港近期的失蹤案。'};s.gold+=10;change('金幣',10);log('接下任務：鐘塔下的失蹤者。');s.scene='towerRoad'}
 if(a==='bargain'){let ok=Math.random()<.55;if(ok){s.gold+=20;change('金幣',20);log('你成功讓米菈先支付更多訂金。')}else{log('米菈拒絕討價還價，但仍給你調查權。')}s.quests.missing={name:'鐘塔下的失蹤者',stage:1,desc:'調查灰港近期的失蹤案。'};s.scene='towerRoad'}
 if(a==='markSigil'){s.flags.sigil=true;log('你記下「裂眼」符號。');s.scene='tavern'}
 if(a==='mercs'){s.flags.towerNoise=true;log('你聽見傭兵提到「鐘塔下面的門」。');toast('獲得線索：地下門');s.scene='tavern'}
 if(a==='bartenderPress'){let bonus=s.classId==='rogue'?0.35:0;let ok=Math.random()<.45+bonus;if(ok){s.flags.cellarKey=true;s.inventory.push({id:'key',name:'生鏽的地窖鑰匙',type:'quest',desc:'酒保偷偷塞給你的鑰匙。'});toast('獲得物品：地窖鑰匙');log('哈洛承認有人利用鐘塔地窖進出。')}else{log('哈洛拒絕再說任何話。')}s.scene='towerRoad'}
 if(a==='buyAle'){if(s.gold>=3){s.gold-=3;s.hp=Math.min(s.maxHp,s.hp+8);change('金幣',-3);change('生命',8);log('你喝了一杯味道可疑的黑麥酒。')}s.scene='tavern'}
 if(a==='track'){let good=['ranger','rogue'].includes(s.classId)||Math.random()<.5;if(good){s.flags.track=true;log('你發現拖行痕跡通往鐘塔側牆。');toast('獲得線索：拖行痕跡')}else log('雨水沖掉了大部分痕跡。');s.scene='towerRoad'}
 if(a==='towerEntry'){if(!s.quests.missing)s.quests.missing={name:'鐘塔下的失蹤者',stage:1,desc:'你自行介入了失蹤案。'};startCombat({name:'腐化鼠群',hp:56,maxHp:56,pow:11,def:2,xp:35,gold:8,onWin:'afterRats'});return}
 save();showScene()
}
function startCombat(e){s.combat=e;log(`遭遇 ${e.name}。`);save();renderCombat()}
function dmg(base,def){return Math.max(1,Math.round(base*(.85+Math.random()*.3)-def*.45))}
function renderCombat(){let e=s.combat,ehp=Math.max(0,Math.round(e.hp/e.maxHp*100));main.innerHTML=`<section class="card"><div class="tag">戰鬥</div><h2 style="margin-top:8px">${e.name}</h2><div class="spread stat"><span>敵人生命 ${e.hp}/${e.maxHp}</span><span>威脅值 ${e.pow}</span></div><div class="bar"><div class="fill enemy" style="width:${ehp}%"></div></div><div class="divider"></div><p>${combatFlavor()}</p><div class="choices"><button class="primary" onclick="combatTurn('attack')">普通攻擊</button><button onclick="combatTurn('skill')">${classes[s.classId].skill} — ${classes[s.classId].skillText}</button><button onclick="combatTurn('potion')">使用治療藥水</button><button class="danger" onclick="combatTurn('flee')">嘗試撤退</button></div></section><section class="card"><h3>戰鬥紀錄</h3><div class="log">${s.log.slice(0,10).map(x=>`<div>• ${x}</div>`).join('')}</div></section>`}
function combatFlavor(){return{warrior:'你穩住腳步，讓盾與武器保持在同一條攻擊線上。',paladin:'你低聲誦念誓詞，聖徽在胸前微微發熱。',ranger:'你控制呼吸，尋找敵人的暴露位置。',rogue:'你繞向陰影，等待對手犯下第一個錯誤。',mage:'奧術能量在指尖聚集，空氣發出細微爆鳴。',cleric:'你握緊權杖，祈禱聲壓過地底的低鳴。'}[s.classId]}
function combatTurn(type){let e=s.combat;if(type==='flee'){if(Math.random()<.45){log('你成功脫離戰鬥。');s.combat=null;s.scene='towerRoad';save();showScene();return}else log('退路被封住了。')}
 else if(type==='potion'){let it=s.inventory.find(x=>x.id==='potion'&&x.qty>0);if(!it){toast('沒有治療藥水');return}else{it.qty--;let heal=Math.min(35,s.maxHp-s.hp);s.hp+=heal;change('生命',heal);log(`你使用治療藥水，回復 ${heal} 生命。`)}}
 else{let hit=dmg(s.pow+(type==='skill'?6:0),e.def);if(type==='skill'&&s.classId==='ranger'&&Math.random()<.38)hit*=2;if(type==='skill'&&s.classId==='rogue')hit+=Math.round((1-e.hp/e.maxHp)*10);if(type==='skill'&&s.classId==='mage'&&Math.random()<.15){s.hp=Math.max(1,s.hp-6);log('失控的奧術反噬了你 6 點生命。')}if(type==='skill'&&s.classId==='paladin'){let heal=Math.min(10,s.maxHp-s.hp);s.hp+=heal}e.hp=Math.max(0,e.hp-hit);log(`${type==='skill'?classes[s.classId].skill:'攻擊'}造成 ${hit} 傷害。`)}
 if(e.hp<=0){winCombat();return}let guard=(type==='skill'&&['warrior','cleric'].includes(s.classId))?4:0;let taken=dmg(e.pow,s.def+guard);s.hp=Math.max(0,s.hp-taken);log(`${e.name} 對你造成 ${taken} 傷害。`);if(s.hp<=0){s.hp=Math.ceil(s.maxHp*.55);s.gold=Math.max(0,s.gold-8);s.combat=null;s.scene='arrival';log('你在城衛哨站醒來，失去了一些金幣。');toast('你被擊倒了');save();showScene();return}save();renderCombat()}
function winCombat(){let e=s.combat;s.xp+=e.xp;s.gold+=e.gold;change('經驗',e.xp);change('金幣',e.gold);log(`擊敗 ${e.name}。獲得 ${e.xp} 經驗與 ${e.gold} 金幣。`);let event=e.onWin;s.combat=null;levelCheck();if(event==='afterRats'){s.location='舊鐘塔';s.quests.missing.stage=2;s.quests.missing.desc='鐘塔內出現被異常力量腐化的生物。深入地窖尋找失蹤者。';s.inventory.push({id:'fang',name:'染黑的鼠牙',type:'trinket',def:1,desc:'不自然地冰冷。佩戴後防禦 +1。'});log('你在鼠群巢穴裡找到一枚刻著裂眼符號的骨片。');s.scene='towerDeep';scenes.towerDeep=()=>({title:'舊鐘塔內部',text:'斷裂的鐘繩垂在中央。地板下傳來低語。你在石階後找到一扇通往地窖的鐵門，而門縫裡正滲出冷霧。第一個小型地下城由此開始。',choices:[['打開地窖門（目前原型終點）','prototypeEnd'],['先返回灰港整備','arrival']]});scenes.prototypeEnd=()=>({title:'原型第一章完成',text:'你已完成目前 v0.1 的核心流程：角色創建、探索、NPC 對話、任務、線索、戰鬥、掉落、裝備與存檔。下一版本將把鐘塔地窖擴充成完整地下城，加入 Boss、派系與更多任務分歧。',choices:[['返回灰港自由探索','arrival']]})}save();showScene()}
function levelCheck(){while(s.xp>=s.level*100){s.level++;s.maxHp+=10;s.hp=s.maxHp;s.pow+=2;s.def+=1;log(`升級！你現在是 ${s.level} 級。`);toast(`升級至 Lv.${s.level}`)}}
function showCharacter(){let c=classes[s.classId];openModal(`<h2>${s.name}</h2><p class="muted">Lv.${s.level} ${c.name}</p><div class="grid"><div class="item"><div class="muted">生命</div><div class="kpi">${s.hp}/${s.maxHp}</div></div><div class="item"><div class="muted">攻擊</div><div class="kpi">${s.pow}</div></div><div class="item"><div class="muted">防禦</div><div class="kpi">${s.def}</div></div><div class="item"><div class="muted">經驗</div><div class="kpi">${s.xp}</div></div></div><div class="divider"></div><h3>職業能力</h3><p><b>${c.skill}</b><br><span class="muted">${c.skillText}</span></p><h3>裝備</h3>${['weapon','armor','trinket'].map(slot=>{let id=s.equipment[slot],it=s.inventory.find(x=>x.id===id);return `<div class="item" style="margin-top:8px"><span class="muted">${{weapon:'武器',armor:'護甲',trinket:'飾品'}[slot]}</span><br>${it?it.name:'— 空 —'}</div>`}).join('')}`)}
function showInventory(){openModal(`<h2>背包</h2><p class="muted">裝備與消耗品會直接影響角色能力；某些任務物品也會開啟特殊選項。</p>${s.inventory.length?s.inventory.map((it,i)=>`<div class="item" style="margin-top:8px"><div class="spread"><b>${it.name}${it.qty?` ×${it.qty}`:''}</b><span class="tag">${it.type}</span></div><div class="muted">${it.desc||''}</div>${['weapon','armor','trinket'].includes(it.type)?`<button style="margin-top:8px" onclick="equip(${i})">裝備</button>`:''}</div>`).join(''):'背包是空的。'}`)}
function equip(i){let it=s.inventory[i];if(!['weapon','armor','trinket'].includes(it.type))return;let old=s.equipment[it.type],oldIt=s.inventory.find(x=>x.id===old);if(oldIt){s.pow-=oldIt.pow||0;s.def-=oldIt.def||0}s.equipment[it.type]=it.id;s.pow+=it.pow||0;s.def+=it.def||0;save();toast(`已裝備：${it.name}`);showInventory()}
function showJournal(){let qs=Object.values(s.quests);openModal(`<h2>任務日誌</h2>${qs.length?qs.map(q=>`<div class="item" style="margin-top:8px"><b>${q.name}</b><div class="muted">${q.desc}</div><div class="tag" style="display:inline-block;margin-top:6px">階段 ${q.stage}</div></div>`).join(''):'目前沒有進行中的任務。'}`)}
function showMenu(){openModal(`<h2>系統</h2><p>遊戲會自動儲存在此裝置的瀏覽器中。</p><button onclick="save();toast('已儲存')">手動儲存</button> <button class="danger" onclick="resetGame()">刪除存檔重新開始</button><div class="divider"></div><p class="muted">灰燼王境 v0.1 · 單頁行動版原型</p>`)}
function resetGame(){if(confirm('確定刪除存檔？')){localStorage.removeItem('ashen-realms-save');location.reload()}}
function openModal(html){$('#sheet').innerHTML=html;$('#modal').classList.remove('hidden')};function closeModal(){$('#modal').classList.add('hidden')}
boot();
</script>
</body>
</html>
